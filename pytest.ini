[pytest]
# Una sola carpeta de QA en la raiz (.qa/, gitignorada): cache y temporales de pytest viven ahi
# y no ensucian la raiz ni dependen de la temp global de Windows (permisos rotos en esta maquina).
# Un `--basetemp=...` explicito en la linea de comandos pisa este valor (gana el ultimo).
cache_dir = .qa/pytest_cache
addopts = --basetemp=.qa/pytest
