[package]
name = "lsim"
version = "0.1.0"
edition = "2021"
description = "Núcleo Monte Carlo del simulador de temporadas de Laplace (mismo protocolo JSON que modelo/go/lsim)"
license = "AGPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
